version: 2

updates:
  - package-ecosystem: npm
    directory: "/urban-community"
    schedule:
      interval: cron
      cronjob: "0 9 1 */2 *" # 09:00 on the 1st of every second month
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    # Expo pins these packages to versions that match the SDK. Upgrade them together with
    # the SDK through "npx expo install --fix" instead of one by one.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-navigation/*"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "@types/react"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # NativeWind 4 requires Tailwind CSS 3, and eslint-config-expo targets ESLint 9.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 9 1 */2 *" # 09:00 on the 1st of every second month
      timezone: Europe/Istanbul
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

